<!DOCTYPE html>
<html>
<head>
    <title>Protein History</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow p-4">

        <h1 class="text-center text-primary">Protein History</h1>

        <table class="table table-striped mt-4">

            <thead>
                <tr>
                    <th>Date</th>
                    <th>Target</th>
                    <th>Consumed</th>
                    <th>Remaining</th>
                </tr>
            </thead>

            <tbody>
                {% for log in logs %}
                <tr>
                    <td>{{ log.date }}</td>
                    <td>{{ log.protein_target }}g</td>
                    <td>{{ log.total_protein }}g</td>
                    <td>{{ log.remaining_protein }}g</td>
                </tr>
                {% endfor %}
            </tbody>

        </table>

        <div class="text-center">
            <a href="/" class="btn btn-secondary">Back Home</a>
        </div>

    </div>

</div>

</body>
</html>
