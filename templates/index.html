<!DOCTYPE html>
<html>
<head>
    <title>Desi Gym Diet AI</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container mt-5">
        <div class="card shadow p-4">
            <h1 class="text-center mb-3">Desi Gym Diet AI</h1>
            <p class="text-center text-muted">Natural Pakistani diet planner for gym users</p>

            <form action="/generate-plan" method="post">

                <div class="mb-3">
                    <label class="form-label">Name</label>
                    <input type="text" name="name" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Age</label>
                    <input type="number" name="age" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Weight (kg)</label>
                    <input type="number" name="weight" step="0.1" class="form-control" required>
                </div>

                <div class="row">
                    <div class="col">
                        <label class="form-label">Feet</label>
                        <input type="number" name="feet" class="form-control" required>
                    </div>

                    <div class="col">
                        <label class="form-label">Inches</label>
                        <input type="number" name="inches" class="form-control" required>
                    </div>
                </div>

                <div class="mb-3 mt-3">
                    <label class="form-label">Goal</label>
                    <select name="goal" class="form-select" required>
                        <option value="muscle_gain">Muscle Gain</option>
                        <option value="fat_loss">Fat Loss</option>
                        <option value="maintain">Maintain Weight</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-success w-100">Generate Diet Plan</button>
            </form>

            <div class="text-center mt-4">
                <a href="/tracker" class="btn btn-outline-primary">Open Protein Tracker</a>
            </div>
        </div>
    </div>
    <a href="/plan-builder" class="btn btn-outline-success mt-2">Custom Diet Plan Builder</a>

</body>
</html>
