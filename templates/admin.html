<!DOCTYPE html>
<html>
<head>
    <title>Admin Food Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow p-4">

        <h1 class="text-center text-danger">Admin Food Manager</h1>

        <div class="text-center mb-3">
            <a href="/logout" class="btn btn-outline-danger">Logout</a>
        </div>

        <form action="/admin/add-food" method="post">

            <div class="mb-3">
                <label class="form-label">Food Name</label>
                <input type="text" name="name" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Unit</label>
                <input type="text" name="unit" class="form-control" placeholder="1 bowl, 100g, 1 glass" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Protein per Unit (g)</label>
                <input type="number" name="protein" class="form-control" required>
            </div>

            <button type="submit" class="btn btn-success w-100">Add Food</button>
        </form>

        <hr>

        <h3>Current Foods</h3>

        <ul class="list-group">
            {% for food in foods %}
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    <span>{{ food.name }} - {{ food.protein }}g per {{ food.unit }}</span>

                    <div>
                        <a href="/admin/edit-food/{{ food.id }}" class="btn btn-warning btn-sm">Edit</a>

                        <form action="/admin/delete-food/{{ food.id }}" method="post" style="display:inline;">
                            <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                        </form>
                    </div>
                </li>
            {% endfor %}
        </ul>

        <div class="text-center mt-4">
            <a href="/tracker" class="btn btn-primary">Go to Tracker</a>
            <a href="/" class="btn btn-outline-secondary">Back Home</a>
        </div>

    </div>
</div>

</body>
</html>
