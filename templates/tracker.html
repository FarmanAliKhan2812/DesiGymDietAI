<!DOCTYPE html>
<html>
<head>
    <title>Protein Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow p-4">

        <h1 class="text-center text-primary">Protein Tracker</h1>
        <p class="text-center text-muted">Foods are loaded from SQLite database</p>

        <form action="/track-protein" method="post">

            <div class="mb-3">
                <label class="form-label">Daily Protein Target (g)</label>
                <input type="number" name="protein_target" value="{{ target }}" class="form-control" required>
            </div>

            <h4>Food Database</h4>

            {% for food in foods %}
                <div class="mb-3">
                    <label class="form-label">
                        {{ food.name }} - {{ food.protein }}g protein per {{ food.unit }}
                    </label>
                    <input type="number" name="food_{{ food.id }}" value="0" class="form-control">
                </div>
            {% endfor %}

            <button type="submit" class="btn btn-success w-100">Calculate Protein</button>
        </form>

        <div class="text-center mt-3">
            <a href="/" class="btn btn-outline-secondary">Back to Diet Planner</a>
        </div>

    </div>
</div>

</body>
</html>
