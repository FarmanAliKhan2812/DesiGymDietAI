<!DOCTYPE html>
<html>
<head>
    <title>Custom Diet Plan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow p-4">

        <h1 class="text-center text-success">Your Custom Diet Plan</h1>

        <div class="alert alert-info">
            <b>Protein Target:</b> {{ protein_target }}g
        </div>

        <h3>Selected Foods</h3>

        <ul class="list-group mb-4">
            {% for food in selected_foods %}
                <li class="list-group-item">
                    {{ food.name }} - {{ food.protein }}g per {{ food.unit }}
                </li>
            {% endfor %}
        </ul>

        <h3>Suggested Plan</h3>

        <ul class="list-group">
            {% for item in plan %}
                <li class="list-group-item">{{ item }}</li>
            {% endfor %}
        </ul>

        <div class="text-center mt-4">
            <a href="/plan-builder?target={{ protein_target }}" class="btn btn-primary">Build Again</a>
            <a href="/" class="btn btn-outline-secondary">Back Home</a>
        </div>

    </div>
</div>

</body>
</html>
