<!DOCTYPE html>
<html>
<head>
    <title>Edit Food</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow p-4">

        <h1 class="text-center text-warning">Edit Food</h1>

        <form action="/admin/update-food/{{ food.id }}" method="post">

            <div class="mb-3">
                <label class="form-label">Food Name</label>
                <input type="text" name="name" value="{{ food.name }}" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Unit</label>
                <input type="text" name="unit" value="{{ food.unit }}" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Protein per Unit (g)</label>
                <input type="number" name="protein" value="{{ food.protein }}" class="form-control" required>
            </div>

            <button type="submit" class="btn btn-success w-100">Save Changes</button>
        </form>

        <div class="text-center mt-3">
            <a href="/admin" class="btn btn-outline-secondary">Back to Admin</a>
        </div>

    </div>
</div>

</body>
</html>
